ethics:
  require_researcher_owned_account: true
  require_no_third_party_data: true
  require_legal_acknowledgement: true
acquisition:
  blackout_days: 183
  domains:
    - "withgoogle.com"
    - "withyoutube.com"
rate_limit_defaults:
  global_max_rps: 0.5
  per_host_max_rps: 0.2
  burst_size: 1
  retry_budget: 3
  backoff_base_seconds: 1.0
  backoff_cap_seconds: 60.0
  retry_strategy: "full_jitter"
  require_single_flight: true
  honor_robots_txt: true
  honor_retry_after: true
  user_agent_contact: "set-contact-before-live-traffic"
