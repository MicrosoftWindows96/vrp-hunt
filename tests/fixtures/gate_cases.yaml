- name: "allow-google-host"
  candidate:
    kind: "host"
    raw_target: "www.google.com"
    intended_action: "recon"
    researcher_owned_account: true
    will_access_third_party_data: false
    legal_acknowledged: true
  expected_decision: "ALLOW"
  expected_rule_id: "allow-google-domain"
  rationale: "Google host in scope with ethics flags satisfied."
