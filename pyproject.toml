[project]
name = "vrp-hunt"
version = "0.1.0"
description = "Guardrailed tooling for authorized VRP research workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "MicrosoftWindows96", email = "spam@zagrosi.com" },
]
keywords = [
    "authorized-security-research",
    "bug-bounty",
    "google-vrp",
    "guardrails",
    "recon",
    "security",
    "vulnerability-research",
    "vrp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "playwright>=1.59.0",
    "pydantic>=2.12",
    "PyYAML>=6.0.2",
    "tldextract>=5.3",
]

[project.urls]
Homepage = "https://github.com/MicrosoftWindows96/vrp-hunt"
Repository = "https://github.com/MicrosoftWindows96/vrp-hunt"
Issues = "https://github.com/MicrosoftWindows96/vrp-hunt/issues"
Security = "https://github.com/MicrosoftWindows96/vrp-hunt/security/policy"

[project.scripts]
vrp-hunt = "vrp_hunt.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.148",
    "mypy>=1.18",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrp_hunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
